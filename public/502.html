<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>502 - Bad Gateway | Suar Hijau</title>
    <link rel="icon" type="image/png" href="/logo_suarhijau.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#22c55e',
                        neutral: {
                            900: '#171717',
                            600: '#525252',
                        },
                        bg: '#fafaf9'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-bg font-sans min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full text-center">
        <div class="mb-8 relative inline-block">
            <!-- Decorative elements -->
            <div class="absolute -top-6 -right-6 w-12 h-12 bg-primary/10 rounded-full blur-xl"></div>
            <div class="absolute -bottom-2 -left-2 w-8 h-8 bg-primary/20 rounded-full blur-lg"></div>

            <h1 class="text-6xl md:text-9xl font-bold text-neutral-900 opacity-20 relative z-10">502</h1>
            <div class="absolute inset-0 flex items-center justify-center z-20">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-24 h-24 text-primary" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a10 10 0 1 0 10 10 10 10 0 0 0-10-10zm-1 15h2v2h-2zm0-8h2v6h-2z" />
                </svg>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-neutral-900 mb-4">Kesalahan Server</h2>
        <p class="text-neutral-600 mb-8 leading-relaxed">
            Terjadi masalah komunikasi dengan server kami. Mohon tunggu beberapa saat dan coba muat ulang halaman.
        </p>

        <button onclick="window.location.reload()"
            class="inline-flex items-center gap-2 bg-primary text-white px-6 py-3 rounded-full font-semibold hover:bg-primary-600 transition-colors shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                <path d="M16 21h5v-5" />
            </svg>
            <span>Muat Ulang Halaman</span>
        </button>
    </div>
</body>

</html>
